[workspace]
resolver = "3"
members = ["crates/collector", "crates/protocol"]
# web-node is a wasm32-only crate; it would break native `cargo test --workspace`.
exclude = ["crates/web-node", "rules/examples/regex-match"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
data-encoding = "2"
thiserror = "2"
tracing = "0.1"
