# promtail -> permafrost
#
# This is a complete, runnable promtail config. Run it with:
#
#   promtail -config.file=deploy/promtail-example.yaml
#
# Everything here is stock promtail except ONE line: the `clients[].url` below.
# permafrost implements Loki's push API on Loki's own port (3100), so pointing
# an existing promtail/Alloy at it is a one-line change and nothing else in your
# pipeline has to move.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Where promtail remembers how far it has read. Survives restarts.
  filename: /tmp/positions.yaml

clients:
  # >>> THE ONE-LINE CHANGE <<<
  # This is the only permafrost-specific line in the file. It was previously
  # something like `http://loki:3100/loki/api/v1/push`; swap the host and you
  # are done. Same path, same port, same snappy-protobuf payload.
  - url: http://collector-host:3100/loki/api/v1/push

    # Optional, all stock promtail. permafrost answers 429 + Retry-After under
    # backpressure (README §Error Handling) and promtail retries natively.
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          # `job`, `host` and `level` are PROMOTED LABELS: permafrost copies them
          # out of the label set into dedicated nullable VARCHAR columns in the
          # Parquet segment (README §2), and indexes their distinct values in the
          # manifest (README §3). That is what makes `WHERE job = 'varlogs'` a
          # cheap column scan and lets the browser skip whole segments without
          # downloading them.
          #
          # Any other label still round-trips losslessly in the `labels`
          # MAP<VARCHAR,VARCHAR> column, queryable as `labels['pod']` — just
          # without the segment-level pruning. Keep `job` and `host` set on every
          # scrape target; add extras freely.
          job: varlogs
          host: ${HOSTNAME:-localhost}
          __path__: /var/log/*.log

    pipeline_stages:
      # Best-effort severity extraction so the third promoted column, `level`,
      # is populated. Non-matching lines simply leave `level` NULL — the regex
      # is not a filter, and `action_on_failure: skip` keeps them flowing.
      - regex:
          expression: '(?i)\b(?P<level>trace|debug|info|warn|warning|error|fatal|crit|critical)\b'
      - labels:
          level:

      # Use the log line's own timestamp when there is one, so the alert deep
      # link's time window lines up with the events rather than with ingest time.
      - regex:
          expression: '^(?P<timestamp>\w{3}\s+\d{1,2} \d{2}:\d{2}:\d{2})'
      - timestamp:
          source: timestamp
          format: 'Jan _2 15:04:05'
          action_on_failure: skip

  # Container logs, if you want them. Same one-line client config applies.
  # - job_name: containers
  #   static_configs:
  #     - targets: [localhost]
  #       labels:
  #         job: containers
  #         host: ${HOSTNAME:-localhost}
  #         __path__: /var/lib/docker/containers/*/*-json.log
  #   pipeline_stages:
  #     - json:
  #         expressions:
  #           line: log
  #           timestamp: time
  #     - timestamp:
  #         source: timestamp
  #         format: RFC3339Nano
  #     - output:
  #         source: line
