# AIDEV-NOTE: standalone crate on purpose. The empty [workspace] table stops cargo from
# adopting this into the repo-root workspace (which is native-only); the root manifest also
# lists this path under `exclude`.
[workspace]

[package]
name = "regex-match"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
regex = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
