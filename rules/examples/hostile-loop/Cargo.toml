# AIDEV-NOTE: standalone crate. The empty [workspace] table keeps cargo from adopting it into
# the repo-root workspace, so it builds without a root-manifest change.
[workspace]

[package]
name = "hostile-loop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = "s"
lto = true
