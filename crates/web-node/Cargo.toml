[package]
name = "permafrost-web-node"
# AIDEV-NOTE: literal, not `.workspace = true` — this crate is excluded from the
# workspace (wasm-only), so it has no root manifest to inherit from.
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Browser-side iroh node: resolves a permafrost ticket into Parquet bytes for DuckDB-WASM"

# AIDEV-NOTE: cdylib only. This crate is built with `wasm-pack build --target web`
# and is excluded from the workspace so `cargo test --workspace` stays native.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
permafrost-protocol = { path = "../protocol" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"
thiserror = "2"

iroh = { version = "1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "time"] }
tracing-web = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
